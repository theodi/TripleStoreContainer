name: Trivy vulnerability scan

on:
  schedule:
    # Mondays 06:00 UTC: picks up new CVEs and rebuilt base images.
    - cron: "0 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    env:
      IMAGE: triplestore:scan
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # No cache and pull: true so the scan sees the current base image,
      # not a stale layer.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          load: true
          pull: true
          no-cache: true
          tags: ${{ env.IMAGE }}

      - name: Scan image (summary in log)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Scan image (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          skip-setup-trivy: true

      - name: Upload results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
